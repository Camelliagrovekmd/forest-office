<!doctype html>
<html lang="ko">
<head>
<base href="app/">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,minimum-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>동백숲한의원 숲속 사무실</title>
<meta name="robots" content="noindex">

<style>
:root{--ink:#2b2117;--paper:#f6ecd6;--paper2:#ead9b6;--wood:#7a4f2e;--wood2:#5a3820;--hi:#fff6c8;--red:#c8303a;--ok:#4f9a4a;--warn:#d8902a;
  --px:'Pretendard','Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif;--sans:'Pretendard','Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif}
*{box-sizing:border-box}
html,body{margin:0;background:#2a1d14;color:var(--ink);font-family:var(--sans)}html{height:100%}body{min-height:100%;overflow-x:hidden;overflow-y:auto;position:relative}
#scene{position:absolute;touch-action:pan-y;left:0;top:0;width:100vw;height:auto;z-index:1}#gl{position:absolute;left:0;top:0;pointer-events:none;z-index:0;display:block}
#boardHi{max-width:none}
button{font:inherit;cursor:pointer}
/* 픽셀 테두리 */
.pxbox{background:rgba(250,243,228,.94);border-radius:12px;box-shadow:0 0 0 1px rgba(122,79,46,.35),0 10px 28px rgba(40,20,5,.32);backdrop-filter:blur(6px)}
/* 현황판(나뭇가지에 걸린 판) */
#hud{position:absolute;left:50%;transform:translateX(-50%);top:14px;padding:10px 12px 10px;width:max-content;max-width:98vw;z-index:5}
#hud:before,#hud:after{content:"";position:absolute;top:-18px;width:3px;height:16px;background:#4a3424}
#hud:before{left:24px}#hud:after{right:24px}
#hud h1{margin:0 0 6px;font:700 15px/1.2 var(--px);letter-spacing:.02em;display:flex;gap:8px;align-items:baseline}
#hud h1 small{font:400 11px var(--px);color:#7a6a52}
#hud h1 .cl{margin-left:auto;font:700 13px var(--px);color:var(--wood)}
#kpis{display:flex;flex-wrap:nowrap;gap:6px;overflow-x:auto;scrollbar-width:none}#kpis::-webkit-scrollbar{display:none}.kp{flex:0 0 auto}
.kp{border:0;border-radius:8px;background:var(--paper2);padding:4px 8px;display:flex;flex-direction:column;align-items:flex-start;min-width:62px;box-shadow:inset 0 -2px 0 rgba(0,0,0,.12)}
.kp b{font:700 16px/1.1 var(--px);font-variant-numeric:tabular-nums}
.kp span{font:400 10.5px/1.3 var(--px);color:#6a5a44}
.kp.ok b{color:var(--ok)}.kp.warn b{color:var(--red)}
.kp:hover{background:var(--hi)}
/* 이름표 */
#tags{position:absolute;inset:0;pointer-events:none;z-index:3}
.tag{position:absolute;left:0;top:0;pointer-events:auto;border:0;padding:3px 8px;border-radius:999px;font:600 11.5px/1.2 var(--px);color:var(--ink);background:rgba(250,243,228,.92);box-shadow:0 2px 6px rgba(40,20,5,.3);white-space:nowrap;display:flex;gap:4px;align-items:center;transition:opacity .2s}
.tag:after{content:"";position:absolute;left:50%;bottom:-5px;margin-left:-4px;border:4px solid transparent;border-top-color:rgba(250,243,228,.92);border-bottom:0}
.tag .st{font-weight:700}
.tag.work{background:#e3f4d4}.tag.work .st{color:var(--ok);animation:dots 1s steps(2) infinite}
.tag.wait{background:#fde6d8}.tag.wait .st{color:var(--red);animation:blink .8s steps(2) infinite}
.tag.rest{opacity:.82}.tag.sleep .nm:after{content:" zZ";color:#7a8aa8}
.tag.hot{background:var(--hi);opacity:1;z-index:2}
/* 명패(책상에 붙은 나무 명패) · 글자 크기는 #tags의 font-size(장면 폭의 0.74%)를 기준(em)으로 */
/* 2배 크기로 그린 뒤 절반으로 줄여 글자를 더 선명하게(원장님 요청 '해상도 2배') */
.plq{position:absolute;pointer-events:auto;cursor:pointer;font-size:2em;transform:translate(-50%,-50%) var(--r,none) scale(.5);transform-origin:50% 50%;border:0;margin:0;font-family:var(--px);color:#3a2614;line-height:1.2;white-space:nowrap;display:flex;flex-direction:column;align-items:center;gap:.12em;padding:.32em .7em .36em;border-radius:.42em;
  background:linear-gradient(180deg,#fffaf0 0%,#f6e7c8 62%,#ecd6ab 100%);
  box-shadow:0 0 0 .14em #8a5a2e,0 0 0 .26em #c99a55,0 .3em .5em rgba(45,22,6,.45),inset 0 .08em 0 rgba(255,255,255,.85),inset 0 -.12em .2em rgba(150,95,40,.18);transition:filter .2s,box-shadow .3s}
.plq:before{content:"";position:absolute;left:50%;top:-.42em;width:.62em;height:.62em;margin-left:-.31em;border-radius:50%;background:radial-gradient(circle at 35% 35%,#ff8a7a,#c8262f 55%,#7d1218);box-shadow:-.5em .08em 0 -.12em #3f7a3a,.5em .08em 0 -.12em #3f7a3a}
.plq .pn{font-weight:800;font-size:1em;letter-spacing:.01em}
.plq .ps{display:flex;align-items:center;gap:.28em;font-size:.8em;font-weight:700;color:#7a5a36}
.plq .dot{width:.56em;height:.56em;border-radius:50%;background:#b9a98e;box-shadow:inset 0 -.08em 0 rgba(0,0,0,.2)}
.plq .md{font-weight:600;color:#9a7a52}.plq .md:empty{display:none}
.plq .bd{background:#c8262f;color:#fff;border-radius:.6em;padding:0 .38em;font-size:.92em}.plq .bd:empty{display:none}
.plq.v{writing-mode:vertical-rl;text-orientation:upright;padding:.7em .3em;letter-spacing:.04em}.plq.v .ps{gap:.22em}.plq.v .md,.plq.v .bd{text-orientation:mixed}
.plq.v:before{top:-.5em}
.plq.work{box-shadow:0 0 0 .14em #2f7d4f,0 0 0 .26em #9fd7a8,0 0 .9em .2em rgba(110,230,150,.75),0 .3em .5em rgba(45,22,6,.4)}.plq.work .dot{background:#2fa35a;animation:pdot 1s ease-in-out infinite}.plq.work .stt{color:#1f6b43}
.plq.wait{box-shadow:0 0 0 .14em #b56a12,0 0 0 .26em #f4c36a,0 0 .9em .2em rgba(255,185,70,.8),0 .3em .5em rgba(45,22,6,.4)}.plq.wait .dot{background:#e8901f}.plq.wait .stt{color:#9a5d0b;animation:blink 1.2s steps(2) infinite}
.plq.done{background:linear-gradient(180deg,#f7f1ff,#e3d3ff);box-shadow:0 0 0 .18em #6d3fd6,0 0 0 .3em #c9b3ff,0 0 1em .25em rgba(150,100,255,.8),0 .3em .5em rgba(45,22,6,.4)}.plq.done .dot{background:#7c3aed}.plq.done .stt{color:#5b21b6}
.plq.rest{filter:saturate(.92)}
.plq.sleep .stt:after{content:" zZ";color:#7a8aa8}
.plq:hover,.plq.hot{filter:brightness(1.07) drop-shadow(0 0 .45em rgba(255,240,200,.95));z-index:2}
@keyframes pdot{50%{transform:scale(1.35)}}
/* 화이트보드 위 링크 칸(장면에 직접 붙음) · 칸 크기는 판 폭의 1/5 */
#wboard{position:absolute;pointer-events:none;display:grid;grid-template-columns:repeat(4,1fr);row-gap:.24em;column-gap:.48em;transform:var(--r,none);transform-origin:0 0}
#wboard .wl{pointer-events:auto;position:relative;display:block;aspect-ratio:1;border:0;padding:0;margin:0;border-radius:18%;background:#fff8ea;box-shadow:0 .12em .3em rgba(45,22,6,.45),0 0 0 .06em #c99a55;cursor:pointer;transition:transform .15s,box-shadow .15s;z-index:1;text-decoration:none}
#wboard .wl img{width:100%;height:100%;display:block;border-radius:18%}
#wboard .wl:nth-child(9){grid-column:3} /* 11/9 원장님: 세 번째 줄 2개는 오른쪽 정렬 */
#wboard .wl:before{content:"";position:absolute;left:50%;top:-.16em;width:.34em;height:.34em;margin-left:-.17em;border-radius:50%;background:radial-gradient(circle at 35% 35%,#ff8a7a,#c8262f 60%,#7d1218);box-shadow:0 .05em .08em rgba(0,0,0,.4);z-index:2}
#wboard .wl span{position:absolute;left:50%;top:104%;transform:translateX(-50%);white-space:nowrap;font:700 .78em var(--px);color:#fff;background:rgba(58,38,20,.9);padding:.12em .45em;border-radius:.4em;opacity:0;transition:opacity .15s;pointer-events:none}
#wboard .wl:hover,#wboard .wl:focus-visible{transform:scale(1.7);z-index:5;box-shadow:0 .3em .7em rgba(45,22,6,.5),0 0 0 .08em #e8c27a}
#wboard .wl:hover span,#wboard .wl:focus-visible span{opacity:1;font-size:.5em}
#wboard .wl.all{display:flex;flex-direction:column;align-items:center;justify-content:center;background:linear-gradient(180deg,#fffaf0,#f1e2c2)}#wboard .wl.all b{font-size:1.1em;line-height:1}
/* 명패 글자·그림은 캔버스가 그림(캐릭터가 앞을 지나갈 수 있게). HTML 명패는 누름·접근성용으로 투명 */
#tags .plq{opacity:0}
/* 원장실 게시판 입력창 */
#pbody .tadd{display:flex;gap:6px;margin:10px 0 2px;position:sticky;top:0;background:var(--paper,#faf3e4);padding:6px 0;z-index:1}
#pbody .tadd input{flex:1;min-width:0;border:2px solid var(--wood2,#8a5a2e);border-radius:8px;padding:7px 9px;font:500 13.5px var(--px);background:#fffdf7}
#pbody .tadd select{border:2px solid var(--paper2,#e8d9b8);border-radius:8px;font:500 12px var(--px);max-width:118px;background:#fffdf7}
#pbody .tadd button{border:0;border-radius:8px;padding:0 12px;font:700 13px var(--px);background:#2f6b4a;color:#fff;cursor:pointer}#pbody .tadd button:disabled{opacity:.5}
#pbody li.td label{cursor:pointer}#pbody li.td input{margin-right:4px;transform:translateY(1px)}
/* 화이트보드 링크 칸(3×3) */
#pbody .lgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:10px 0 6px}
#pbody .lt{position:relative;display:flex;flex-direction:column;align-items:center;gap:3px;padding:0;text-decoration:none;color:#3a2614;transition:transform .15s,filter .15s}
#pbody .lt img{filter:drop-shadow(0 3px 4px rgba(45,22,6,.35))}
#pbody .lt .le{display:flex;align-items:center;justify-content:center;width:100%;aspect-ratio:1;border-radius:14px;background:linear-gradient(180deg,#fffaf0,#f1e2c2);box-shadow:0 0 0 2px #c99a55}
#pbody a.lt:hover{transform:translateY(-2px);filter:brightness(1.05)}
#pbody .lt img{width:100%;aspect-ratio:1;object-fit:contain;border-radius:8px}
#pbody .lt .le{font-size:34px;line-height:1.6}
#pbody .lt b{font:700 12px var(--px);text-align:center}
#pbody .lt.off{opacity:.6}#pbody .lt i{font:600 10px var(--px);color:#9a2a20;font-style:normal}

@keyframes blink{50%{opacity:.25}}@keyframes dots{50%{opacity:.4}}
/* 말풍선 */
#tip{position:fixed;left:0;top:0;z-index:6;pointer-events:none;padding:7px 9px;font:400 12px/1.5 var(--px);max-width:240px}
#tip .mut{color:#7a6a52}
/* 아래 도구줄 */
#dock{position:absolute;left:50%;transform:translateX(-50%);display:flex;gap:4px;padding:6px;z-index:5;flex-wrap:nowrap;justify-content:center;max-width:98vw;overflow-x:auto;scrollbar-width:none}#dock::-webkit-scrollbar{display:none}#dock button{flex:0 0 auto;white-space:nowrap}
#dock button{border:0;border-radius:8px;background:var(--paper2);padding:6px 11px;font:400 12px var(--px);color:var(--ink)}
#dock button:hover,#dock button:focus-visible{background:var(--hi);outline:none}
#upd{position:absolute;right:14px;bottom:16px;z-index:5;font:400 11px var(--px);color:#f6ecd6;text-shadow:1px 1px 0 #000}
/* 패널 */
#panel{position:fixed;right:16px;top:18px;bottom:72px;width:min(420px,calc(100vw - 32px));z-index:7;display:flex;flex-direction:column}
#panel[hidden]{display:none}
#panel{overflow:hidden}#panel header{display:flex;align-items:center;gap:8px;padding:10px 12px;background:var(--wood);color:var(--paper)}
#panel header h2{margin:0;font:700 14px var(--px);flex:1}
#pclose{border:0;border-radius:6px;background:var(--paper);color:var(--wood2);font:700 12px var(--px);padding:3px 8px}
#pbody{overflow:auto;padding:6px 14px 16px;font-size:13.5px;line-height:1.55}
#pbody h4.flash{background:#fff3c8;transition:background 1.5s}#pbody h4{font:700 12.5px var(--px);margin:14px 0 6px;color:var(--wood2);border-bottom:2px dotted var(--paper2);padding-bottom:3px}
#pbody .ls{list-style:none;margin:0;padding:0}
#pbody .ls li{padding:5px 0;border-bottom:1px solid var(--paper2)}
#pbody .mut{color:#7a6a52}#pbody .small{font-size:12px}
#pbody .tm{font:400 11px var(--px);color:var(--wood);margin-right:4px}
#pbody .dc{font:400 10.5px var(--px);background:var(--paper2);padding:1px 5px;margin-left:2px;white-space:nowrap}
#pbody .ext{font:700 10px var(--px);background:#3c5a3a;color:#f6ecd6;padding:1px 4px}
#pbody .warnl{color:#8a2a20}
#pbody a{color:#2d5a4b;font-weight:700}
#pbody details{margin:4px 0;background:#fbf4e4;padding:4px 8px}#pbody summary{cursor:pointer;font-weight:700}
.badge{border-radius:6px;display:inline-block;font:700 12px var(--px);padding:3px 8px;margin:10px 0 0}
.badge.work{background:#d6efc4;color:#2e6a2a}.badge.wait{background:#fbd9c8;color:#9a2a20}.badge.rest{background:var(--paper2)}.badge.done{background:#d8e6f4}
.bar{display:grid;grid-template-columns:52px 1fr 44px;gap:8px;align-items:center;font:400 12px var(--px)}
.bar i{height:12px;background:var(--paper2);position:relative;box-shadow:inset 0 0 0 1px #c9b48a}
.bar i:after{content:"";position:absolute;inset:0 auto 0 0;width:var(--p);background:var(--ok)}
.bar i.md:after{background:var(--warn)}.bar i.hi:after{background:var(--red)}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:10px}
.dcard{border:0;text-align:left;background:#fbf4e4;padding:8px;display:flex;flex-direction:column;gap:2px;box-shadow:inset 0 -2px 0 rgba(0,0,0,.1)}
.dcard b{font:700 12.5px var(--px)}.dcard span{font-size:12px}
.dcard.work{background:#e3f4d4}.dcard.wait{background:#fde6d8}
.dcard:hover{background:var(--hi)}
#loading{position:fixed;inset:0;display:grid;place-items:center;font:400 13px var(--px);color:#f6ecd6;pointer-events:none}
@media (max-width:720px){#hud{left:8px;right:8px;top:12px;padding:8px;transform:none;max-width:none}.kp{min-width:54px}#panel{left:8px;right:8px;top:auto;height:62vh;width:auto;bottom:64px}.tag{font-size:10px}}
/* 전체보기: 여백이 있으면 현황판은 위, 바로가기는 아래(장면 밖) */
body.fitmode{background:#1e150e}
#fsbtn{position:absolute;z-index:6;border:0;border-radius:12px;padding:7px 12px;font:700 13px var(--px);color:#fff7e6;background:rgba(30,20,12,.62);box-shadow:0 2px 10px rgba(0,0,0,.35);backdrop-filter:blur(4px)}
#fsbtn:hover{background:rgba(30,20,12,.8)}
#hudlinks{display:none}
body.fitroom{background:#f3e8d2}
body.fitroom #hud{left:0;right:0;top:0;transform:none;max-width:none;width:100%;border-radius:0;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:8px;padding:10px 12px;box-shadow:0 2px 0 rgba(122,79,46,.25)}
body.fitroom #hud h1{width:100%;max-width:820px}
body.fitroom #kpis{justify-content:center;max-width:820px}
body.fitroom #hudlinks{display:flex;flex-wrap:wrap;justify-content:center;gap:6px 10px;max-width:820px}
#hudlinks a{display:flex;flex-direction:column;align-items:center;gap:2px;width:62px;text-decoration:none;color:#3a2614;font:600 10.5px var(--px)}
#hudlinks img{width:40px;height:40px;object-fit:contain;border-radius:9px;filter:drop-shadow(0 2px 3px rgba(45,22,6,.3))}
#hudlinks span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:62px;text-align:center}
body.fitroom #dock{left:0;right:0;bottom:auto;transform:none;max-width:none;width:100%;border-radius:0;align-items:center;align-content:center;box-shadow:0 -2px 0 rgba(122,79,46,.25)}
body.fitroom #dock [data-open="boss"],body.fitroom #dock [data-open="hud"],body.fitroom #dock [data-open="usage"],body.fitroom #dock [data-open="upcoming"],body.fitroom #dock [data-open="links"],body.fitroom #dock #fitbtn{display:none}
body.fitroom #hud{top:0}
body.fitroom #hud:before,body.fitroom #hud:after{display:none}

/* 아래로 내리면 나오는 목록 */
#below{position:absolute;left:0;right:0;padding:14px 12px 40px;background:linear-gradient(180deg,#2a1d14 0,#f3e8d2 40px);display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,420px),1fr));gap:12px}
#below .bhint{grid-column:1/-1;margin:0 0 2px;text-align:center;font:600 12px var(--px);color:#7a5a36}
#below .bsec{padding:0 14px 12px;font-size:13.5px;line-height:1.55;backdrop-filter:none}
#below h3{margin:0 -14px 8px}#below h3 button{width:100%;display:flex;justify-content:space-between;align-items:center;border:0;border-radius:12px 12px 0 0;background:var(--wood);color:var(--paper);padding:9px 14px;font:700 14px var(--px)}#below h3 button span{font:500 12px var(--px);opacity:.85}
#below h4{font:700 12.5px var(--px);margin:12px 0 6px;color:var(--wood2);border-bottom:2px dotted var(--paper2);padding-bottom:3px}
#below .ls{list-style:none;margin:0;padding:0}#below .ls li{padding:5px 0;border-bottom:1px solid rgba(122,79,46,.12)}
#below .mut{color:#8a6a46}#below a{color:#7a3f12}
#below .grid{display:grid;grid-template-columns:repeat(2,1fr);gap:6px}#below .dcard{display:flex;flex-direction:column;align-items:flex-start;gap:1px;border:0;border-radius:10px;background:var(--paper2);padding:7px 9px;text-align:left;font:inherit}
#below .bar{display:grid;grid-template-columns:44px 1fr 44px;align-items:center;gap:6px;margin:4px 0}#below .bar i{display:block;height:9px;border-radius:9px;background:linear-gradient(90deg,#3f9a5a var(--p),#e6d3ad var(--p))}#below .bar i.md{background:linear-gradient(90deg,#d8902a var(--p),#e6d3ad var(--p))}#below .bar i.hi{background:linear-gradient(90deg,#c8303a var(--p),#e6d3ad var(--p))}
#below details summary{cursor:pointer;color:#7a5a36}#below img{max-width:100%}
#below .lgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}#below .lt{display:flex;flex-direction:column;align-items:center;text-decoration:none;color:#3a2614}#below .lt img{width:56px;height:56px;object-fit:contain}
/* 11/6 전체보기 위·아래 알차게 */
#hudrow{display:flex;align-items:center;gap:8px}#hudtools{display:none;gap:4px;flex:0 0 auto}#hudtools button{border:0;border-radius:8px;background:var(--paper2);padding:6px 10px;font:400 12px var(--px);color:var(--ink);white-space:nowrap}#hudtools button:hover{background:var(--hi)}
#hudgrid,#dockfit{display:none}
@media (max-width:820px){.kp{padding:3px 6px;min-width:0}.kp b{font-size:14px}.kp span{font-size:9.5px}}
body.fitroom #hud{justify-content:flex-start;padding-top:8px;overflow:hidden}body.fitroom #dock{overflow:hidden}
body.fitroom #hudrow{width:100%;max-width:1200px;justify-content:center;flex-wrap:wrap;row-gap:6px}body.fitroom #kpis{flex-wrap:wrap;justify-content:center;overflow:visible}
body.fitroom #hudtools{display:flex}
body.fitroom #hudgrid{display:grid;grid-template-columns:minmax(150px,300px) minmax(0,1fr) auto;align-items:center;gap:12px;width:100%;max-width:1200px;flex:1 1 auto;min-height:0}
#miniuse{background:var(--paper2);border-radius:12px;padding:8px 10px;cursor:pointer;align-self:center}#miniuse h5,#bboard h5{margin:0 0 4px;font:700 12px var(--px);color:var(--wood2)}#miniuse h5 small{font-weight:400;color:#8a6a46}
.mu{display:grid;grid-template-columns:44px 1fr 34px;align-items:center;gap:5px;font:600 11px var(--px);margin:3px 0;color:#3a2614}.mu i{height:7px;border-radius:7px;background:linear-gradient(90deg,#3f9a5a var(--p),#e6d3ad var(--p))}.mu i.md{background:linear-gradient(90deg,#d8902a var(--p),#e6d3ad var(--p))}.mu i.hi{background:linear-gradient(90deg,#c8303a var(--p),#e6d3ad var(--p))}.mu b{text-align:right}.mu em{grid-column:2/4;font:400 9.5px var(--px);color:#8a6a46;font-style:normal;margin-top:-3px}

<body>

<script>/* 동백숲 공개 운영실 (office-public) — 공개용 덧붙임
   - 내부 데이터 없이 돌아가는 '하루 일과' 가짜 데이터(상태만)
   - 아기 부엉이·토끼: 놀고 돌아와 한약 파우치로 쉬고 다시 힘내기 (효과 문구 없음)
   - 동백 화분 성장 일기: 방문할수록, 머무는 동안 조금씩 자람 (한약과 무관)
   - 아기들도 방문 횟수에 따라 아주 조금씩 자람 (한약과 무관)
   빌드: tools/build_public.py 가 3dv3 소스에 이 파일을 붙여 index.html 을 만든다. */
(() => {
'use strict';
window.PUB = 1;

/* ---------- 방문 기록(이 브라우저에만 저장) ---------- */
let visits = 1;
try { visits = (+localStorage.getItem('pub.visits') || 0) + 1; localStorage.setItem('pub.visits', String(visits)); } catch (e) {}
const T0 = performance.now();
const stayMin = () => (performance.now() - T0) / 60000;

/* 아기 키: 첫 방문 0.92 → 8번째 방문부터 1.06 (조금씩) */
window.PUB_GROW = 0.92 + 0.14 * Math.min(1, (visits - 1) / 7);

/* 동백 화분 단계 0~5: 방문 횟수 + 머문 시간(45초마다 한 단계, 최대 +2) */
const STAGES = ['새싹', '떡잎', '줄기', '꽃봉오리', '첫 꽃', '활짝'];
const plantStage = () => Math.min(5, Math.min(3, visits - 1) + Math.min(2, Math.floor(stayMin() * 60 / 45)));

/* ---------- 공개용 하루 일과 데이터 ---------- */
const DEPTS = [
  ['boss', '원장실', '원장', 11.7, 28.5], ['ctl', '총괄실', '부엉이', 0, 0], ['col', '건강칼럼팀', '토끼', 0, 0], ['vid', '영상팀', '여우', 0, 0],
  ['edu', '공부방', '사슴', 0, 0], ['herb', '약재실', '다람쥐', 0, 0], ['ops', '살림팀', '수달', 0, 0], ['news', '소식팀', '고양이', 0, 0],
  ['diet', '린다이어트', '너구리', 0, 0], ['tang', '탕전실', '곰', 0, 0]
];
function statusFor(i) {
  const d = new Date(), m = d.getHours() * 60 + d.getMinutes();
  if (m < 9 * 60 || m >= 19 * 60) return '쉬는 중';            // 밤·이른 아침: 다 같이 쉼
  if (m >= 13 * 60 && m < 14 * 60) return i % 2 ? '쉬는 중' : '일하는 중'; // 점심: 반씩
  const slot = Math.floor(m / 10) + i * 3;                       // 10분 단위, 부서마다 어긋나게
  return slot % 5 === 0 ? '쉬는 중' : '일하는 중';               // 50분 일하고 10분 쉼
}
function pubData() {
  const depts = DEPTS.map(([id, name, animal, x, y], i) => ({ id, name, role: '', animal, model: '', x, y, status: statusFor(i), waiting: 0, attention: 0, today: 0, lastAt: '', current: '', boss: id === 'boss' }));
  const working = depts.filter(d => d.status === '일하는 중').length;
  return { generatedAt: new Date().toISOString(), depts, counts: { working, waitingDepts: 0, resting: depts.length - working }, boss: {}, approvals: [], running: [], upcoming: [], recent: [], log: [], tasks: [] };
}
window.PUB_DATA = pubData;

/* ---------- 현황판 → 동백숲 소식판 ---------- */
window.PUB_BOARD_TITLE = '동백숲 소식판';
window.PUB_BOARD = () => {
  const out = (window.HD_BABIES || []).length + (window.HD_BUNNIES || []).length;
  const h = new Date().getHours();
  const part = h < 9 ? '아침 준비' : h < 12 ? '오전' : h < 13 ? '오전' : h < 14 ? '점심' : h < 19 ? '오후' : '쉬는 밤';
  return [
    ['v', '👋 방문', visits + '번째', 't'],
    ['p', '🌱 동백 화분', STAGES[plantStage()], 't'],
    ['b', '🐣 아기들', out ? out + '마리 노는 중' : '쉬는 중', 't'],
    ['t', '🕘 지금', part, 't']
  ];
};

/* ---------- 부서 소개 창(내부 정보 없이) ---------- */
const INTRO = {
  boss: '원장님 방이에요. 하루 일과에 따라 책상, 창가, 소파, 트리, 셀카존을 오가요.',
  ctl: '부엉이가 사무실 하루를 챙겨요. 아기 부엉이들이 자주 날아다니며 놀다가 돌아와요.',
  col: '토끼가 건강 칼럼을 정리해요. 아기 토끼들은 트리까지 달리기 시합을 해요.',
  vid: '여우가 영상과 그림을 만들어요.', edu: '사슴이 책을 읽고 공부해요.', herb: '다람쥐가 약재를 살펴요.',
  ops: '수달이 사무실 살림과 기계를 돌봐요.', news: '고양이가 동백숲 소식을 모아요.', diet: '너구리가 식단표를 짜요.', tang: '곰이 탕전실에서 솥을 지켜요.'
};
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
window.PUB_OPEN = (kind, id) => {
  const p = document.getElementById('panel'); if (!p) return;
  const key = kind === 'dept' || kind === 'staff' ? id : (kind === 'boss' || kind === 'board' ? 'board' : id);
  let title, body;
  if (key === 'board' || !INTRO[key]) {
    title = '🌺 동백숲 소식판';
    body = `<p>동물 직원들이 일하고 쉬는 숲속 사무실이에요.</p>
      <h4>동백 화분 성장 일기</h4><p>지금 <b>${esc(STAGES[plantStage()])}</b> 단계예요. 다시 놀러 오시거나 조금 더 머무르시면 자라요.</p>
      <h4>아기들</h4><p>아기 부엉이와 토끼가 놀다 돌아오면 파우치를 들고 잠깐 쉬었다가 다시 놀러 나가요.</p>
      <h4>동백숲한의원</h4><p><a href="https://hani1.com" target="_blank" rel="noopener">홈페이지</a> · <a href="https://blog.naver.com/dbshani" target="_blank" rel="noopener">블로그</a> · <a href="https://www.instagram.com/camellia_grove_kmc/" target="_blank" rel="noopener">인스타그램</a></p>`;
  } else {
    const d = DEPTS.find(x => x[0] === key); const i = DEPTS.indexOf(d);
    title = `${d[1]} · ${d[2]}`;
    body = `<p>${esc(INTRO[key])}</p><p class="mut">지금: ${esc(statusFor(i))}</p>`;
  }
  p.dataset.kind = kind; p.dataset.id = id || '';
  document.getElementById('ptitle').textContent = title; document.getElementById('pbody').innerHTML = body; p.hidden = false;
};

/* ---------- 한약 파우치 (쉬는 시간 간식) ----------
   t: 시작 뒤 초. 0~.5 나타남, .5~3.6 쪽쪽(내용물 줄어듦), 3.6~4.6 사라지며 반짝 + 말풍선 */
const POUCH_T = 7.6; /* 11/10 원장님: 마시고 나서 3초 더 머무름 */ window.PUB_POUCH_T = POUCH_T;
function star(c, x, y, r) { c.beginPath(); for (let i = 0; i < 8; i++) { const a = i * Math.PI / 4, rr = i % 2 ? r * .4 : r; c.lineTo(x + Math.cos(a) * rr, y + Math.sin(a) * rr); } c.closePath(); c.fill(); }
window.PUB_POUCH = (c, x, y, h, t, face) => {
  if (t == null || t < 0 || t > POUCH_T) return;
  c.save(); c.translate(x, y);
  const pop = t < .5 ? 1 - Math.pow(1 - t / .5, 3) * 1 : t > 3.6 ? Math.max(0, 1 - (t - 3.6) / .6) : 1;
  const sip = t < .5 ? 1 : t > 3.6 ? .1 : 1 - (t - .5) / 3.1 * .9;      // 남은 양
  const bob = t > .5 && t < 3.6 ? Math.sin(t * 9) * h * .02 : 0;
  if (pop > 0) {
    c.save(); c.translate(0, bob); c.scale(pop, pop); c.rotate((face || 1) * -.12);
    const w = h * .62, hh = h; // 파우치 몸통
    c.fillStyle = 'rgba(40,25,10,.18)'; c.beginPath(); c.ellipse(0, hh * .52, w * .55, hh * .08, 0, 0, 7); c.fill();
    const g = c.createLinearGradient(-w / 2, 0, w / 2, 0); g.addColorStop(0, '#d9dcd6'); g.addColorStop(.45, '#fbfbf7'); g.addColorStop(1, '#c4c8c0');
    c.fillStyle = g; c.strokeStyle = '#8f938b'; c.lineWidth = Math.max(1, h * .035);
    c.beginPath(); c.moveTo(-w / 2, -hh * .38); c.lineTo(w / 2, -hh * .38); c.lineTo(w / 2 * .92, hh * .44); c.quadraticCurveTo(0, hh * .54, -w / 2 * .92, hh * .44); c.closePath(); c.fill(); c.stroke();
    // 내용물(갈색) 창
    c.save(); c.beginPath(); c.rect(-w * .36, -hh * .18, w * .72, hh * .56); c.clip();
    c.fillStyle = 'rgba(255,255,255,.5)'; c.fillRect(-w * .36, -hh * .18, w * .72, hh * .56);
    const top = hh * .38 - hh * .56 * sip; const lg = c.createLinearGradient(0, top, 0, hh * .38); lg.addColorStop(0, '#8a5326'); lg.addColorStop(1, '#5b3215');
    c.fillStyle = lg; c.fillRect(-w * .36, top, w * .72, hh * .56); c.restore();
    // 동백 꽃 라벨
    c.fillStyle = '#c8303a'; for (let i = 0; i < 5; i++) { const a = i * Math.PI * 2 / 5 - Math.PI / 2; c.beginPath(); c.arc(Math.cos(a) * w * .1, -hh * .27 + Math.sin(a) * w * .1, w * .085, 0, 7); c.fill(); }
    c.fillStyle = '#f4c36a'; c.beginPath(); c.arc(0, -hh * .27, w * .05, 0, 7); c.fill();
    // 윗부분 톱니·빨대
    c.fillStyle = '#b9bdb5'; c.fillRect(-w / 2, -hh * .44, w, hh * .07);
    c.strokeStyle = '#7fb48f'; c.lineWidth = Math.max(1.4, h * .07); c.lineCap = 'round'; c.beginPath(); c.moveTo(w * .18, -hh * .42); c.lineTo(w * .3 * (face || 1) + w * .1, -hh * .72); c.stroke();
    c.restore();
  }
  // 쪽쪽: 음표, 끝: 반짝 + 말풍선
  if (t > .7 && t < 3.6) { const k = (t * 1.3) % 1; c.globalAlpha = 1 - k; c.fillStyle = '#7a4f2e'; c.font = `700 ${Math.round(h * .32)}px sans-serif`; c.fillText('♪', h * .35, -h * (.6 + k * .5)); c.globalAlpha = 1; }
  if (t > 3.4) { const k = Math.min(1, (t - 3.4) / 1.2); const fade = t > POUCH_T - .5 ? Math.max(0, (POUCH_T - t) / .5) : 1; c.globalAlpha = fade * (1 - Math.max(0, k - .6) / .4); c.fillStyle = '#ffd36a';
    for (let i = 0; i < 5; i++) { const a = i * 1.26 + 0.4, r = h * (.35 + .55 * k); star(c, Math.cos(a) * r, -h * .25 + Math.sin(a) * r * .7, h * .09 * (1 - k * .5)); }
    c.globalAlpha = fade; const fs = Math.max(9, h * .3); c.font = `700 ${fs}px "Pretendard","Malgun Gothic",sans-serif`; const txt = '힘내자!'; const tw = c.measureText(txt).width;
    const bx = -tw / 2 - fs * .4, by = -h * 1.35 - fs; c.fillStyle = 'rgba(255,250,238,.95)'; c.strokeStyle = '#a8743f'; c.lineWidth = Math.max(1, fs * .08);
    c.beginPath(); c.roundRect(bx, by, tw + fs * .8, fs * 1.4, fs * .5); c.fill(); c.stroke(); c.fillStyle = '#5a3820'; c.textBaseline = 'middle'; c.fillText(txt, -tw / 2, by + fs * .7); c.globalAlpha = 1; }
